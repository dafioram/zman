name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  walkthrough:
    name: Walkthrough (mock system in a pseudo-terminal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pyte (test-only)
        run: python -m pip install pyte
      - name: Walkthrough
        run: WALK_OUT=walk-out python -m unittest tests.test_walkthrough -v
      - name: Keep rendered screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-screens
          path: walk-out/
          if-no-files-found: ignore

  integration:
    name: Integration (real ZFS, file-backed pool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ZFS
        run: |
          sudo apt-get update
          sudo apt-get install -y zfsutils-linux
          sudo modprobe zfs || {
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe zfs
          }
          zfs version
      - name: Integration tests
        run: sudo env ZMAN_INTEGRATION=1 PYTHONDONTWRITEBYTECODE=1 python3 -m unittest tests.test_integration -v

  scripts:
    name: ShellCheck and install cycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck install.sh uninstall.sh tests/install_cycle.sh
      - name: Scripts are executable in git
        run: |
          for f in install.sh uninstall.sh zman.py; do
            mode=$(git ls-files -s "$f" | cut -c1-6)
            [ "$mode" = "100755" ] || { echo "$f is not executable in git ($mode)"; exit 1; }
          done
      - name: Install, reinstall, uninstall into a temporary prefix
        run: sh tests/install_cycle.sh
